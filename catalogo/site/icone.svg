<!-- O ÍCONE DE TELA INICIAL (E8 do briefing, D8 do PLANO-DESIGN): o favicon.svg
     com o fundo ajustado ao quadro e o desenho a 80%, centrado em (16,16). No
     favicon o desenho vai a 41% do lado a partir do centro; o Android recorta
     o ícone em círculo e só garante os 40% do meio (a zona segura do
     "maskable"). A 80%, ele fica em 33%. Os PNGs saem daqui:
       magick -background none -density 4608 icone.svg -resize 512x512 -strip PNG24:icone-512.png
       magick -background none -density 1728 icone.svg -resize 192x192 -strip PNG24:icone-192.png -->
