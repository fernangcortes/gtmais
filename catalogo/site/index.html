<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<!-- NÃO troque por "no-referrer". A proteção do Bunny é por Allowed Referrers:
     sem o cabeçalho Referer, a pull zone responde 403 e as capas somem. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Goiás Tec + — catálogo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">

<meta property="og:title" content="Goiás Tec + — catálogo">
<meta property="og:description" content="Catálogo interno de vídeos do Goiás Tec +.">
<meta property="og:image" content="https://goias-tec-mais.pages.dev/og-image.png">
<meta property="og:url" content="https://goias-tec-mais.pages.dev/">
<meta property="og:type" content="website">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- A SENTINELA do cabeçalho (D5): 1 px no alto do documento. Enquanto ela está
     na tela, a página está no alto e o cabeçalho fica sem fundo; quando ela
     sai, o cabeçalho fica sólido. Quem avisa é um IntersectionObserver no
     app.js — nenhum ouvinte de `scroll`. -->
<div class="topo-sentinela" id="topo-sentinela" aria-hidden="true"></div>

<a class="pular" href="#conteudo" id="pular">Pular para o conteúdo</a>

<!-- O CABEÇALHO DE STREAMING (D5): o logo, dois links e a busca, numa linha
     só. `topo-flutuante` é o que o deixa sem fundo no alto da página — o
     /admin usa o `.topo` puro, que continua sólido.

     Os chips de série SAÍRAM daqui (decisão D8): foram para a página Séries e
     para o filtro da grade. A linha deles nascia vazia e empurrava a página ao
     ganhar os botões, e é por isso que o cabeçalho não tem mais nenhuma caixa
     que o JS encha depois de o catálogo chegar. -->
<header class="topo topo-flutuante" id="topo">
  <div class="limite topo-linha">
    <!-- O logo é a imagem de compartilhamento do Lucas recortada no logo: o
         "Cabeçalho" que veio junto tem o texto da pílula em Calibri viva, e
         celular não tem Calibri.
         O <picture> de duas fontes saiu na D1 (14/09): com um tema só, não há
         o que escolher. O `logo-fundo-claro.svg` continua no site — é o que
         serve a quem exportar ou imprimir a marca sobre branco, e sai do ar
         junto com a decisão de ter tema claro, não antes. -->
    <a class="marca" href="#/" data-inicio>
      <img class="marca-logo" src="logo-fundo-escuro.svg" width="117" height="48"
           alt="Goiás Tec + — catálogo interno">
    </a>
    <nav class="topo-nav" aria-label="Seções do catálogo">
      <a class="topo-link" href="#/" data-inicio>Início</a>
      <a class="topo-link" href="#/series">Séries</a>
    </nav>
    <div class="busca" id="busca-caixa">
      <label class="pular" for="busca">Buscar no catálogo</label>
      <input id="busca" type="search" autocomplete="off" spellcheck="false"
             placeholder="Buscar por título, tema ou o que é falado…">
      <!-- Só no celular, com a busca aberta. Ícone é <path> em currentColor:
           sem fonte de ícone, sem CDN. -->
      <button type="button" class="topo-botao busca-fechar" id="busca-fechar" aria-label="Fechar a busca">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <!-- Só no celular: o campo recolhido atrás de um botão. Aberto, ele toma o
         lugar do logo e dos links, e a linha continua com a mesma altura. -->
    <button type="button" class="topo-botao busca-abrir" id="busca-abrir" aria-controls="busca-caixa" aria-expanded="false" aria-label="Buscar no catálogo">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.5 4 a6.5 6.5 0 1 0 0 13 a6.5 6.5 0 1 0 0 -13 Z M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- `tabindex="-1"` é o que dá ao atalho de pular um lugar onde pousar: o
     <main> aceita foco pelo script, e não entra na ordem do Tab. -->
<main id="conteudo" class="limite" tabindex="-1">
  <div id="avisos"></div>
  <div id="conteudo-grade"></div>
  <div id="conteudo-ficha" hidden></div>
</main>

<footer class="rodape">
  <div class="limite">
    Uso interno da rede. Não divulgar o endereço. ·
    <a href="admin.html">Administração</a>
  </div>
</footer>

<!-- O hls.js NÃO entra aqui: player.js o carrega sob demanda, e só na ficha de
     quem abriu com ?player=novo. A grade não paga 353 KB por ele. -->
<script src="catalogo-core.js"></script>
<script src="player-core.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>
</body>
</html>
